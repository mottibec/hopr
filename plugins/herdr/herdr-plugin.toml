id = "hopr"
name = "Hopr"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Move an idle agent conversation and Git workspace to another Mac"
platforms = ["macos"]

[[actions]]
id = "move"
title = "Move agent to another Mac"
contexts = ["pane", "workspace"]
command = ["sh", "run.sh", "herdr-popup"]

[[panes]]
id = "move"
title = "Hopr — move to another Mac"
placement = "popup"
width = "85%"
height = "75%"
command = ["sh", "run.sh", "menu", "--herdr-plugin"]
